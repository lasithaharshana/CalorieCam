services:
  mongodb:
    image: mongo:7
    container_name: caloriecam-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    container_name: caloriecam-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017

volumes:
  mongo_data:
